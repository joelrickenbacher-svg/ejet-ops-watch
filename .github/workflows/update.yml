name: Daten aktualisieren

on:
  schedule:
    - cron: "30 4 * * *"    # 06:30 Zürich (Sommerzeit)
    - cron: "30 15 * * *"   # 17:30 Zürich (Sommerzeit)
  workflow_dispatch: {}

permissions:
  contents: write
  models: read      # kostenlose KI von GitHub (GitHub Models)

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Selbsttest
        run: node scripts/selftest.mjs
      - name: Quellen sammeln und aufbereiten
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODELS_MODEL: ${{ vars.MODELS_MODEL }}
        run: node scripts/collect.mjs
      - name: Änderungen committen
        run: |
          git add data/issues.json data/processed.json
          if git diff --cached --quiet; then echo "Keine Änderungen."; exit 0; fi
          git config user.name "ops-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daten: $(node -p "require('./data/issues.json').note")"
          git push

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      pages: write
      id-token: write
