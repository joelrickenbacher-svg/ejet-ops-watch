name: Daten aktualisieren

on:
  schedule:
    - cron: "30 4 * * *"   # täglich 04:30 UTC = 06:30 Zürich (Sommerzeit)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Selbsttest
        run: node scripts/selftest.mjs
      - name: Claude-Recherche
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
        run: node scripts/update.mjs
      - name: Änderungen committen
        run: |
          if git diff --quiet -- data/issues.json; then echo "Keine Änderungen."; exit 0; fi
          git config user.name "ops-watch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/issues.json
          git commit -m "Daten: $(node -p "require('./data/issues.json').note")"
          git push

  deploy:
    needs: update
    uses: ./.github/workflows/deploy.yml
    permissions:
      pages: write
      id-token: write
