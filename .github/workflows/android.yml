name: Android-App bauen

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "index.html"
      - "styles.css"
      - "app.js"
      - "icons/**"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: android-build
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

- name: Android-SDK-Lizenzen bestätigen
           run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Signaturschlüssel bereitstellen
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "EJW_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::Secret ANDROID_KEYSTORE_BASE64 fehlt – die APK wird mit einem Test-Schlüssel signiert. Updates lassen sich dann nicht über die alte Version installieren."
          fi

      - name: APK bauen
        working-directory: android
        env:
          EJW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: >
          gradle assembleRelease --no-daemon --stacktrace
          -Pejw.dataUrl="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/issues.json"
          -Pejw.versionCode=${{ github.run_number }}
          -Pejw.versionName="1.0.${{ github.run_number }}"

      - name: APK umbenennen
        run: cp android/app/build/outputs/apk/release/app-release.apk ejet-ops-watch.apk

      - name: Als Release veröffentlichen
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Ops Watch für Android 1.0.${{ github.run_number }}
          make_latest: "true"
          files: ejet-ops-watch.apk
          body: |
            APK herunterladen und auf dem Android-Gerät öffnen. Beim ersten Mal „Installation aus unbekannten Quellen“ für den Browser bzw. Dateimanager erlauben.
            Daten: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/issues.json

      - uses: actions/upload-artifact@v4
        with:
          name: ejet-ops-watch-apk
          path: ejet-ops-watch.apk
